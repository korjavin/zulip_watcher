name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binaries
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = windows ] && ext=".exe"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "dist/zulip_watcher_${os}_${arch}${ext}" .
          done
          (cd dist && sha256sum zulip_watcher_* > checksums.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
